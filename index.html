<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<header><h1>Scanner</h1><span id="count"></span></header>
<main>
  <section id="cam">
    <video id="video" autoplay playsinline muted></video>
    <div class="bar">
      <label class="btn ghost">Upload<input id="file" type="file" accept="image/*" hidden></label>
      <button id="shot" class="shutter" aria-label="Kuhanan ang litrato"></button>
      <label class="btn ghost">Phone camera<input id="file2" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
  </section>

  <section id="crop" hidden>
    <canvas id="cc"></canvas>
    <p class="hint">I-drag ang apat na sulok papunta sa gilid ng papel.</p>
    <div class="bar">
      <button id="retake" class="btn ghost">Ulitin</button>
      <button id="apply" class="btn">I-crop</button>
    </div>
  </section>

  <section id="edit" hidden>
    <canvas id="ec"></canvas>
    <div class="modes">
      <button data-m="magic">Magic Color</button>
      <button data-m="gray">Grayscale</button>
      <button data-m="bw">B&amp;W</button>
      <button data-m="original">Original</button>
    </div>
    <div class="bar">
      <button id="back" class="btn ghost">Balik</button>
      <button id="rot" class="btn ghost">I-rotate</button>
      <button id="add" class="btn">Idagdag ang page</button>
    </div>
  </section>
</main>

<footer id="tray">
  <div id="thumbs"></div>
  <div class="exports">
    <button data-x="pdf" disabled>PDF</button>
    <button data-x="docx" disabled>Word</button>
    <button data-x="png" disabled>PNG</button>
    <button data-x="jpg" disabled>JPG</button>
  </div>
</footer>
<div id="toast" role="status"></div>
</body>
</html>
